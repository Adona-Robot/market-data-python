# Publishes to PyPI when a GitHub release is published, through Trusted Publishing:
# no token is stored anywhere. PyPI must list this repository, this workflow file
# (publish.yml) and the environment "pypi" as a trusted publisher first.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install -e ".[all,backtrader,vectorbt]" pytest pytest-asyncio responses && .venv/bin/python -m pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

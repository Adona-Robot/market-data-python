name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e . pytest pytest-asyncio responses pandas "websockets>=13"
      - run: .venv/bin/python -m pytest -q
